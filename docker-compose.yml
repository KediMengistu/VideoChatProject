services:
  api:
    build:
      context: ./ChatAppBackend
      dockerfile: Dockerfile
    container_name: chatapp-api
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - ./.env
    environment:
      # Override Redis host when running in Docker (connects to redis service)
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
